apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: infra
  sources:
    - repoURL: https://github.com/henryschoemer/argo.git
      targetRevision: HEAD
      path: charts/cert-manager
      helm:
        valueFiles:
          - ../../values/cert-manager.yaml
    - repoURL: https://github.com/henryschoemer/argo.git
      targetRevision: HEAD
      path: manifests/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true